name: Amazon Review Watcher

on:
  schedule:
    # UTC基準。3時間おき(日本時間でも3時間おき)
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run review check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scrape_reviews.py

      - name: Commit updated state
        run: |
          git config user.name "review-watcher-bot"
          git config user.email "review-watcher-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update review state"
          git push
